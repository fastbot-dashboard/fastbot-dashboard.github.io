          padding:10px 18px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:var(--accent-dark); }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:10px; font-size:13px; min-height:1.2em; color:var(--ink2); }
  .msg.err { color:var(--err); }
  .hint { color:var(--ink3); font-size:12.5px; margin-top:16px; }
  .stamp { color:var(--ink3); font-size:12px; margin-top:20px; padding-top:14px;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password) {
  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iterations, hash:"SHA-256" },
    material, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
}

async function unlock() {
  const btn = document.getElementById("unlockBtn");
  const msg = document.getElementById("msg");
  const pw = document.getElementById("pw").value;
  if (!pw) { msg.textContent = "Please enter the password."; msg.className = "msg err"; return; }
  btn.disabled = true; msg.textContent = "Decrypting…"; msg.className = "msg";
  try {
    const key = await deriveKey(pw);
    const pt = await crypto.subtle.decrypt(
      { name:"AES-GCM", iv:b64(PAYLOAD.page.iv) }, key, b64(PAYLOAD.page.data));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (e) {
    msg.textContent = "Incorrect password — please try again.";
    msg.className = "msg err";
    btn.disabled = false;
  }
}
document.getElementById("unlockBtn").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
</script>
